name: CI

on:
  pull_request:
  # release.yml runs it again on every push to main before release-please.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Also type-checks the templates (strictTemplates).
      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:ci

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: coverage/piano-tracker
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-linux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The App Center reads this to show the publisher, license and description.
      - name: Validate AppStream metainfo
        run: |
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net linux/dev.fmanzano.pianotracker.metainfo.xml

      # `tauri::generate_context!` embeds `frontendDist` at compile time; the tests don't need the real one.
      - name: Placeholder frontend
        working-directory: .
        run: mkdir -p dist/piano-tracker/browser && echo '<!doctype html>' > dist/piano-tracker/browser/index.html

      # The #[ignore] tests (real audio, system SoundFont) stay out, as they do locally.
      - name: Test with coverage
        run: cargo llvm-cov --lib --no-report

      - name: Coverage reports
        run: |
          out="$GITHUB_WORKSPACE/coverage-rust"
          mkdir -p "$out"
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --json --summary-only --output-path "$out/summary.json"
          cargo llvm-cov report --lcov --output-path "$out/lcov.info"
          cargo llvm-cov report --html --output-dir "$out"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: coverage-rust
          if-no-files-found: ignore

  # Keeps the macOS release build from breaking unnoticed (CoreAudio/CoreMIDI instead of ALSA, no /proc).
  backend-macos:
    name: Backend (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Placeholder frontend
        working-directory: .
        run: mkdir -p dist/piano-tracker/browser && echo '<!doctype html>' > dist/piano-tracker/browser/index.html

      - name: Test
        run: cargo test --lib

  # Keeps the Android build (Kotlin MIDI plugin, oboe, Gradle) from breaking unnoticed, and leaves a
  # debug APK to install with `adb install`. It carries arm64 and 32-bit ARM; it is never released.
  android:
    name: Android (debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android

      # The runner's SDK may not have the platform the project compiles against. The versions match
      # app/build.gradle.kts (compileSdk 37) and the NDK that was tried locally.
      - name: Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      # beforeBuildCommand builds the frontend; the CLI regenerates the git-ignored Gradle files.
      - name: Build the APK
        run: npx tauri android build --debug --apk --target aarch64 armv7

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 14
          if-no-files-found: error

  coverage:
    name: Coverage report
    needs: [frontend, backend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Summarize
        run: |
          node .github/scripts/coverage-summary.mjs \
            coverage/coverage-frontend/coverage-summary.json \
            coverage/coverage-backend/summary.json > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token: they only see the job summary.
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        with:
          header: coverage
          path: coverage-report.md
