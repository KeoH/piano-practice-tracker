name: Release

# Every push to main: tests, then release-please updates the "chore(main): release X.Y.Z" PR.
# Merging that PR creates the vX.Y.Z tag and GitHub Release, and `bundle` attaches the installers.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    # A called workflow can't get more than its caller grants (the coverage job asks for these).
    permissions:
      contents: read
      pull-requests: write

  release-please:
    name: Release PR
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With GITHUB_TOKEN the release PR doesn't trigger ci.yml; a PAT in RELEASE_PLEASE_TOKEN does.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  bundle:
    name: Installers (${{ matrix.name }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the AppImage links against its glibc, so it runs on more distros.
          - name: Linux
            os: ubuntu-22.04
            rust-targets: ''
            build-args: ''
            installers: >-
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          # One universal .dmg (Apple Silicon + Intel); tauri.macos.conf.json sets the targets and ad-hoc signing.
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            installers: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/setup-linux

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: bundle

      - run: npm ci

      # beforeBuildCommand builds the frontend; the bundle targets come from the platform's tauri config.
      - name: Build installers
        run: npm run tauri build -- ${{ matrix.build-args }}

      # "Piano Practice Tracker_X.Y.Z_amd64.deb" -> "piano-practice-tracker_X.Y.Z_amd64.deb"
      - name: Collect installers
        run: |
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          shopt -s nullglob
          for f in ${{ matrix.installers }}; do
            name="$(basename "$f")"
            name="${name// /-}"
            cp "$f" "$out/${name/Piano-Practice-Tracker/piano-practice-tracker}"
          done
          ls -1 "$out" | grep -q . || { echo "No installers were built" >&2; exit 1; }
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: ${{ runner.temp }}/installers
          if-no-files-found: error

  publish:
    name: Upload installers
    needs: [release-please, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      # A single SHA256SUMS.txt for every platform.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: installers
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
