[package]
name = "piano-tracker"
version = "0.7.1"
description = "Piano practice tracker: USB-MIDI recording, take slicing, timeline comments and local data vaults"
authors = ["Francisco Manzano <keoh77@gmail.com>"]
license = "MIT"
homepage = "https://fmanzano.dev/"
repository = "https://github.com/KeoH/piano-practice-tracker"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# MIDI (`midir` has no Android backend: there the ports come from the Kotlin plugin)
midly = "0.5"

# Audio
cpal = "0.15"
rustysynth = "1.3"

# Persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# Vault lock: host name and liveness of the process that holds it (no `/proc` on macOS)
libc = "0.2"

# Markdown images (they arrive as base64 from the frontend)
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
midir = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-midi = { path = "plugins/android-midi" }
# cpal's Android backend (oboe) is C++: link the shared runtime and ship libc++_shared.so with the APK
# (the static one leaves `__cxa_pure_virtual` and friends unresolved at load time).
oboe-sys = { version = "0.6", features = ["shared-stdcxx"] }

[dev-dependencies]
tempfile = "3"
# `tauri::test::mock_app` lets the command tests build a `State` and an `AppHandle`.
tauri = { version = "2", features = ["protocol-asset", "test"] }

# Less memory when compiling/linking: no debuginfo in dependencies and only line tables in the crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 4

# The synthesizer and audio need optimization even in `tauri dev` to render in real time.
[profile.dev.package.rustysynth]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.midly]
opt-level = 3
