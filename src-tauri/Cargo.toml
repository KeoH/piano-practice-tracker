[package]
name = "piano-tracker"
version = "0.1.0"
description = "Piano Practice Tracker: grabación MIDI, recorte destructivo, comentarios en línea de tiempo y bóvedas de datos locales"
authors = ["keoh"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# MIDI
midir = "0.10"
midly = "0.5"

# Audio
cpal = "0.15"
rustysynth = "1.3"

# Persistencia
rusqlite = { version = "0.31", features = ["bundled"] }

# Imágenes del Markdown (llegan en base64 desde el frontend)
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Menos memoria al compilar/enlazar: sin debuginfo en dependencias y solo tablas de línea en el crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 4

# El sintetizador y el audio necesitan optimización incluso en `tauri dev` para renderizar en tiempo real.
[profile.dev.package.rustysynth]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.midly]
opt-level = 3
