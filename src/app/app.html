<div class="flex h-full flex-col">
  @if (bannerVisible()) {
    <div class="flex items-center gap-3 border-b border-accent/25 bg-accent/10 px-4 py-2 text-[13px] text-fg" role="status">
      <span class="dot bg-accent"></span>
      <span class="flex-1">{{ notTauriMessage }} La interfaz es navegable pero las acciones no se ejecutarán.</span>
      <button type="button" class="btn btn-ghost h-8" (click)="bannerVisible.set(false)">Ocultar</button>
    </div>
  }
  <div class="flex min-h-0 flex-1">
    <app-sidebar />
    <main class="min-w-0 flex-1 overflow-y-auto bg-ink-900">
      <app-session-view />
    </main>
  </div>
</div>

@if (sync.settingsOpen()) {
  <app-drive-settings />
}
<app-confirm-dialog />
<app-toasts />
